# API contract: the interface's types (frontend/src/api/schema.d.ts) must be the ones the
# server's OpenAPI gives. On every push to main and every pull request that touches the server or
# these types. Apart from the "Frontend" workflow, so that a change to the server alone neither
# rebuilds nor redeploys the site's image.
name: API contract

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/api/**"
      - "frontend/scripts/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/api/**"
      - "frontend/scripts/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running run; on main, each commit keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  api:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm run check:api` reads the server's OpenAPI with `uv run … sibylle openapi`. setup-uv no
      # longer publishes a major tag (`v10` does not exist): the version is pinned by its commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: npm ci
      - name: Compare schema.d.ts with the server's OpenAPI
        run: npm run check:api
