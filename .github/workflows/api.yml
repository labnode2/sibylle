# Contrat d'API : les types de l'interface (frontend/src/api/schema.d.ts) doivent être ceux que
# donne l'OpenAPI du serveur. À chaque push sur main et à chaque pull request qui touche le serveur
# ou ces types. À part du workflow « Interface », pour qu'un changement du seul serveur ne
# reconstruise ni ne redéploie l'image du site.
name: Contrat d'API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/api/**"
      - "frontend/scripts/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/api/**"
      - "frontend/scripts/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur une pull request remplace son run en cours ; sur main, chaque commit garde
# le sien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  api:
    name: Contrat d'API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm run check:api` lit l'OpenAPI du serveur avec `uv run … sibylle openapi`. setup-uv ne
      # publie plus de tag majeur (`v10` n'existe pas) : la version est figée par son commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Installer les dépendances
        run: npm ci
      - name: Comparer schema.d.ts à l'OpenAPI du serveur
        run: npm run check:api
