# Backend: on every push to main and every pull request that touches the server, the checks of
# `make check-backend` (the tests' PostgreSQL comes from testcontainers, Docker is on the runner),
# then the server's Docker image (backend/Dockerfile). On main, once the checks pass, the image
# goes to the registry, tagged `main` and `sha-<commit>` (and with its release tag, v0.2.0, when
# the commit has one), then the production machine updates itself (deploy.yml); elsewhere, the
# image is only built. Repository secrets: REGISTRY_USERNAME
# and REGISTRY_PASSWORD for the registry, DEPLOY_WEBHOOK_SECRET for the hooks (deploy/README.md).
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running run; on main, each commit keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.labnode.ovh
  IMAGE: registry.labnode.ovh/sibylle/backend

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv no longer publishes a major tag: the version is pinned by its commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked
      - name: Format (ruff format)
        run: uv run ruff format --check
      - name: Lint (ruff check)
        run: uv run ruff check
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pushed: ${{ steps.login.outcome == 'success' }}
    env:
      # A secret cannot be read in an `if:`: its presence goes through the job's environment.
      HAS_REGISTRY: ${{ secrets.REGISTRY_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # With the tags, for the version.
          fetch-depth: 0
      # The version comes from the release tags (`git describe`): v0.2.0 on the tagged commit,
      # v0.2.0-3-g88f5f2f three commits later. A tagged commit's image also gets its tag.
      - name: Commit and version
        id: commit
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "describe=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "release=$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      # The actions that see the registry password are pinned by their commit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        id: login
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build the image (and push it from main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.short }}
            ${{ steps.commit.outputs.release && format('{0}:{1}', env.IMAGE, steps.commit.outputs.release) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Warn if the image was not pushed
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY != 'true'
        run: echo "::warning::Image built but not pushed, for lack of the REGISTRY_USERNAME and REGISTRY_PASSWORD secrets."

  # The machine updates itself (deploy.yml).
  deploy:
    name: Deploy
    needs: image
    if: needs.image.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
