# Serveur : à chaque push sur main et à chaque pull request qui touche le serveur, les
# vérifications de `make check-backend` (le PostgreSQL des tests vient de testcontainers, Docker
# est sur le runner), puis l'image Docker du serveur (backend/Dockerfile). Sur main, une fois les
# vérifications passées, l'image part dans le registre, taguée `main` et `sha-<commit>`, puis la
# machine de production se met à jour (deploy/webhook/hooks.yaml) ; ailleurs, l'image est
# seulement construite. Secrets du dépôt : REGISTRY_USERNAME et REGISTRY_PASSWORD pour le
# registre, DEPLOY_WEBHOOK_SECRET pour les crochets (deploy/README.md).
name: Serveur

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur une pull request remplace son run en cours ; sur main, chaque commit garde
# le sien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.labnode.ovh
  IMAGE: registry.labnode.ovh/sibylle/backend

jobs:
  check:
    name: Vérifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv ne publie plus de tag majeur : la version est figée par son commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Installer les dépendances
        run: uv sync --locked
      - name: Formatage (ruff format)
        run: uv run ruff format --check
      - name: Analyse (ruff check)
        run: uv run ruff check
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pushed: ${{ steps.login.outcome == 'success' }}
    env:
      # Un secret ne se lit pas dans un `if:` : sa présence passe par l'environnement du job.
      HAS_REGISTRY: ${{ secrets.REGISTRY_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version courte du commit
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Les actions qui voient le mot de passe du registre sont figées par leur commit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Se connecter au registre
        id: login
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Construire l'image (et l'envoyer depuis main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prévenir si l'image n'est pas partie
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY != 'true'
        run: echo "::warning::Image construite mais pas envoyée faute de secrets REGISTRY_USERNAME et REGISTRY_PASSWORD."

  # The machine pulls the image that was just pushed, backs up, restarts and checks the health of
  # the services (deploy/update.sh). Cloudflare cuts a response that takes more than 100 s: the
  # `deploy` hook therefore answers at once and the update runs in the background. This job
  # follows it through the `deploy-status` hook, shows its log as it goes and fails with it.
  deploy:
    name: Deploy
    needs: image
    if: needs.image.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    # At worst: 15 min waiting for another update, 5 min for the services' health, then 5 more
    # min to roll back.
    timeout-minutes: 35
    environment:
      name: production
      url: https://sibylle.cc
    steps:
      - name: Update the production machine
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          HOOKS: ${{ vars.DEPLOY_HOOKS_URL || 'https://sibylle.cc/hooks' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::No deploy: the DEPLOY_WEBHOOK_SECRET secret is not set."
            exit 0
          fi
          # call HOOK BODY: the signed request; the HTTP code on the output, the response in
          # response.txt.
          call() {
            signature=$(printf '%s' "$2" | python3 -c 'import hashlib, hmac, os, sys; print(hmac.new(os.environ["SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
            curl --silent --show-error --max-time 30 --output response.txt --write-out '%{http_code}' \
              --header "Content-Type: application/json" \
              --header "X-Hub-Signature-256: sha256=$signature" \
              --data-binary "$2" "$HOOKS/$1"
          }
          # The complete log lines (after the state line) not shown yet; with `all`, also a last
          # line without a line ending, ended so that GitHub reads the `::error::` that follows.
          shown=0
          show() {
            total=$(($(wc -l <response.txt) - 1))
            if [ "$1" = all ]; then
              tail -n +$((shown + 2)) response.txt | sed -e '$a\'
            elif [ "$total" -gt "$shown" ]; then
              tail -n +2 response.txt | head -n "$total" | tail -n +$((shown + 1))
              shown=$total
            fi
          }

          # Each attempt of the job has its own id, under which the machine keeps the log.
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          code=$(call deploy "{\"id\":\"$id\",\"commit\":\"$GITHUB_SHA\"}") ||
            { echo "::error::Machine unreachable at $HOOKS/deploy: nginx must relay /hooks/ (deploy/README.md)."; exit 1; }
          sed -e '$a\' response.txt
          case $code in
            202) ;;
            403) echo "::error::Request refused by the machine: missing signature, invalid commit or id."; exit 1 ;;
            500)
              # webhook answers 500 to a wrong signature, before running anything.
              if grep -q "evaluating hook rules" response.txt; then
                echo "::error::Signature refused: DEPLOY_WEBHOOK_SECRET is not the machine's secret."
              else
                echo "::error::Unexpected answer from the machine: HTTP 500."
              fi
              exit 1 ;;
            *) echo "::error::Unexpected answer from the machine: HTTP $code."; exit 1 ;;
          esac

          # The state every 10 s until the outcome. Six missed answers in a row stop the
          # following (a single one can come from an nginx restart), not the update.
          started=$SECONDS
          misses=0
          while sleep 10; do
            if code=$(call deploy-status "{\"id\":\"$id\"}") && [ "$code" = 200 ]; then
              misses=0
              case $(head -n 1 response.txt) in
                state=success) show all; exit 0 ;;
                state=failure)
                  show all
                  echo "::error::The update failed on the machine (log above)."
                  exit 1 ;;
                state=running) show ;;
                state=unknown)
                  if [ $((SECONDS - started)) -ge 60 ]; then
                    echo "::error::The machine did not start the update: see journalctl -u sibylle-webhook."
                    exit 1
                  fi ;;
                *) cat response.txt ;;
              esac
            elif [ $((misses += 1)) -ge 6 ]; then
              echo "::error::The machine no longer answers at $HOOKS/deploy-status (HTTP ${code:-none})."
              exit 1
            fi
            if [ $((SECONDS - started)) -ge 1800 ]; then
              echo "::error::The update is still running after 30 min (log above)."
              exit 1
            fi
          done
