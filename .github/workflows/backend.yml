# Serveur : à chaque push sur main et à chaque pull request qui touche le serveur, les
# vérifications de `make check-backend` (le PostgreSQL des tests vient de testcontainers, Docker
# est sur le runner), puis l'image Docker du serveur (backend/Dockerfile). Sur main, une fois les
# vérifications passées, l'image part dans le registre, taguée `main` et `sha-<commit>`, puis la
# machine de production est prévenue (deploy/webhook/hooks.yaml) ; ailleurs, l'image est
# seulement construite. Secrets du dépôt : REGISTRY_USERNAME et REGISTRY_PASSWORD pour le
# registre, DEPLOY_WEBHOOK_SECRET pour le crochet (deploy/README.md).
name: Serveur

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur une pull request remplace son run en cours ; sur main, chaque commit garde
# le sien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.labnode.ovh
  IMAGE: registry.labnode.ovh/sibylle/backend

jobs:
  check:
    name: Vérifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv ne publie plus de tag majeur : la version est figée par son commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - name: Installer les dépendances
        run: uv sync --locked
      - name: Formatage (ruff format)
        run: uv run ruff format --check
      - name: Analyse (ruff check)
        run: uv run ruff check
      - name: Types (mypy)
        run: uv run mypy
      - name: Tests (pytest)
        run: uv run pytest

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pushed: ${{ steps.login.outcome == 'success' }}
    env:
      # Un secret ne se lit pas dans un `if:` : sa présence passe par l'environnement du job.
      HAS_REGISTRY: ${{ secrets.REGISTRY_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version courte du commit
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Les actions qui voient le mot de passe du registre sont figées par leur commit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Se connecter au registre
        id: login
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Construire l'image (et l'envoyer depuis main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prévenir si l'image n'est pas partie
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY != 'true'
        run: echo "::warning::Image construite mais pas envoyée faute de secrets REGISTRY_USERNAME et REGISTRY_PASSWORD."

  # La machine tire l'image qui vient de partir, sauvegarde, redémarre et contrôle la santé des
  # services (deploy/update.sh) ; sa réponse est le journal de la mise à jour, et ce job échoue
  # avec elle.
  deploy:
    name: Déployer
    needs: image
    if: needs.image.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://sibylle.cc
    steps:
      - name: Prévenir la machine de production
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          URL: ${{ vars.DEPLOY_WEBHOOK_URL || 'https://sibylle.cc/hooks/deploy' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::Pas de déploiement : le secret DEPLOY_WEBHOOK_SECRET n'est pas posé."
            exit 0
          fi
          body="{\"commit\":\"$GITHUB_SHA\"}"
          signature=$(printf '%s' "$body" | python3 -c 'import hashlib, hmac, os, sys; print(hmac.new(os.environ["SECRET"].encode(), sys.stdin.buffer.read(), hashlib.sha256).hexdigest())')
          code=$(curl --silent --show-error --max-time 900 --output response.txt --write-out '%{http_code}' \
            --header "Content-Type: application/json" \
            --header "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$body" "$URL") ||
            { echo "::error::Machine injoignable sur $URL : nginx doit relayer /hooks/deploy (deploy/README.md)."; exit 1; }
          cat response.txt
          case $code in
            200) ;;
            403) echo "::error::Requête refusée par la machine : signature absente ou commit invalide."; exit 1 ;;
            500)
              # webhook répond aussi 500 à une mauvaise signature, avant de lancer quoi que ce soit.
              if grep -q "evaluating hook rules" response.txt; then
                echo "::error::Signature refusée : DEPLOY_WEBHOOK_SECRET n'est pas le secret de la machine."
              else
                echo "::error::La mise à jour a échoué sur la machine (journal ci-dessus)."
              fi
              exit 1 ;;
            *) echo "::error::Réponse inattendue de la machine : HTTP $code."; exit 1 ;;
          esac
