# Interface : à chaque push sur main et à chaque pull request qui touche l'interface ou nginx, les
# vérifications de `make check-frontend` (le contrat d'API a son workflow, api.yml), la
# construction de l'appli, puis l'image du site (deploy/nginx/Dockerfile : l'interface servie par
# nginx). L'interface construite (frontend/dist) reste téléchargeable 14 jours depuis la page du
# run. Sur main, une fois les vérifications passées, l'image part dans le registre, taguée `main`
# et `sha-<commit>`, puis la machine de production se met à jour (deploy.yml) ; ailleurs, l'image
# est seulement construite. Secrets du dépôt : ceux du workflow « Serveur ».
name: Interface

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/nginx/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "deploy/nginx/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur une pull request remplace son run en cours ; sur main, chaque commit garde
# le sien.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.labnode.ovh
  IMAGE: registry.labnode.ovh/sibylle/web

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Formatage (Prettier)
        run: npm run format:check
      - name: Analyse (ESLint)
        run: npm run lint
      - name: Types (TypeScript)
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: Construire l'appli (Vite)
        run: npm run build
      - name: Garder l'interface construite
        uses: actions/upload-artifact@v7
        with:
          name: interface
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  image:
    name: Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pushed: ${{ steps.login.outcome == 'success' }}
    env:
      # Un secret ne se lit pas dans un `if:` : sa présence passe par l'environnement du job.
      HAS_REGISTRY: ${{ secrets.REGISTRY_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version courte du commit
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Les actions qui voient le mot de passe du registre sont figées par leur commit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Se connecter au registre
        id: login
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # Construite depuis la racine du dépôt (deploy/nginx/Dockerfile.dockerignore n'en garde que
      # frontend/ et deploy/nginx/), avec son propre cache, à part de celui de l'image du serveur.
      - name: Construire l'image (et l'envoyer depuis main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/nginx/Dockerfile
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Prévenir si l'image n'est pas partie
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY != 'true'
        run: echo "::warning::Image construite mais pas envoyée faute de secrets REGISTRY_USERNAME et REGISTRY_PASSWORD."

  # The machine updates itself (deploy.yml).
  deploy:
    name: Deploy
    needs: image
    if: needs.image.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
