# Frontend: on every push to main and every pull request that touches the interface or nginx, the
# checks of `make check-frontend` (the API contract has its own workflow, api.yml), the app's
# build, then the site's image (deploy/nginx/Dockerfile: the interface served by nginx). The built
# interface (frontend/dist) can be downloaded for 14 days from the run's page. On main, once the
# checks pass, the image goes to the registry, tagged `main` and `sha-<commit>` (and with its
# release tag, v0.2.0, when the commit has one), then the production machine updates itself
# (deploy.yml); elsewhere, the image is only built. The interface shows the version from the
# release tags (frontend/vite.config.ts). Repository secrets: the same as the "Backend"
# workflow's.
name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "deploy/nginx/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "deploy/nginx/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running run; on main, each commit keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.labnode.ovh
  IMAGE: registry.labnode.ovh/sibylle/web

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Format (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Types (TypeScript)
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test
      - name: Build the app (Vite)
        run: npm run build
      - name: Keep the built interface
        uses: actions/upload-artifact@v7
        with:
          name: interface
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  image:
    name: Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pushed: ${{ steps.login.outcome == 'success' }}
    env:
      # A secret cannot be read in an `if:`: its presence goes through the job's environment.
      HAS_REGISTRY: ${{ secrets.REGISTRY_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # With the tags, for the version.
          fetch-depth: 0
      # The version comes from the release tags (`git describe`): v0.2.0 on the tagged commit,
      # v0.2.0-3-g88f5f2f three commits later. A tagged commit's image also gets its tag.
      - name: Commit and version
        id: commit
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "describe=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "release=$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      # The actions that see the registry password are pinned by their commit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        id: login
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # Built from the repository root (deploy/nginx/Dockerfile.dockerignore keeps only frontend/
      # and deploy/nginx/), with its own cache, apart from the server image's.
      - name: Build the image (and push it from main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/nginx/Dockerfile
          push: ${{ steps.login.outcome == 'success' }}
          # The version shown at the bottom of the sign-in page and of the settings.
          build-args: |
            SIBYLLE_COMMIT=${{ github.sha }}
            SIBYLLE_DESCRIBE=${{ steps.commit.outputs.describe }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ steps.commit.outputs.short }}
            ${{ steps.commit.outputs.release && format('{0}:{1}', env.IMAGE, steps.commit.outputs.release) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Warn if the image was not pushed
        if: github.ref == 'refs/heads/main' && env.HAS_REGISTRY != 'true'
        run: echo "::warning::Image built but not pushed, for lack of the REGISTRY_USERNAME and REGISTRY_PASSWORD secrets."

  # The machine updates itself (deploy.yml).
  deploy:
    name: Deploy
    needs: image
    if: needs.image.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
