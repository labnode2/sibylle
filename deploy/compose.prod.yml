# Production, on the home machine, which is also the development PC: a Compose project of its
# own (`sibylle-prod`), with its own volumes and no published port, so the development database
# (project `sibylle`, port 5432) is never touched. deploy/update.sh runs it from /opt/sibylle,
# with the production settings of deploy/.env (deploy/README.md).
# nginx and certbot will join it with their configuration (T142, T207, T210).
name: sibylle-prod

x-logging: &logging
  # Rotated logs: the `local` driver keeps 5 files of 20 MB per container.
  driver: local

x-backend: &backend
  image: ${SIBYLLE_BACKEND_IMAGE:-registry.labnode.ovh/sibylle/backend}:${SIBYLLE_TAG:-main}
  restart: unless-stopped
  env_file: .env
  volumes:
    - uploads:/data/uploads
  depends_on:
    db:
      condition: service_healthy
  logging: *logging

# The database is the db service's, not the one in deploy/.env (localhost in development).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sibylle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from deploy/.env}@db:5432/${POSTGRES_DB:-sibylle}
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sibylle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sibylle}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    <<: *backend
    command: ["serve"]
    environment:
      <<: *backend-env
      # Only nginx reaches the API: the visitor's address comes from its X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "sibylle", "worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  uploads:
