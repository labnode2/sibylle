# Production, on the home machine, which is also the development PC: a Compose project of its
# own (`sibylle-prod`), with its own volumes, so the development database (project `sibylle`,
# port 5432) is never touched. Only nginx publishes a port, to which the box forwards its port
# 443. deploy/update.sh runs it from /opt/sibylle, with the production settings of deploy/.env
# (deploy/README.md).
name: sibylle-prod

x-logging: &logging
  # Rotated logs: the `local` driver keeps 5 files of 20 MB per container.
  driver: local

x-backend: &backend
  image: ${SIBYLLE_BACKEND_IMAGE:-registry.labnode.ovh/sibylle/backend}:${SIBYLLE_BACKEND_TAG:-main}
  restart: unless-stopped
  env_file: .env
  volumes:
    - uploads:/data/uploads
  depends_on:
    db:
      condition: service_healthy
  logging: *logging

# The database is the db service's, not the one in deploy/.env (localhost in development).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sibylle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from deploy/.env}@db:5432/${POSTGRES_DB:-sibylle}
  UPLOAD_DIR: /data/uploads

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sibylle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sibylle}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  api:
    <<: *backend
    command: ["serve"]
    environment:
      <<: *backend-env
      # Only nginx reaches the API: the visitor's address comes from its X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "sibylle", "worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # The interface and the entry point (deploy/nginx/): TLS with Cloudflare's origin certificate,
  # the API, the WebSocket and the deploy hooks.
  nginx:
    image: ${SIBYLLE_WEB_IMAGE:-registry.labnode.ovh/sibylle/web}:${SIBYLLE_WEB_TAG:-main}
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN missing from deploy/.env}
      SIBYLLE_ORIGIN_PULL: ${SIBYLLE_ORIGIN_PULL:-off}
    ports:
      # The box forwards its port 443 here, in IPv4 (the DNS has no AAAA record).
      - 0.0.0.0:${SIBYLLE_HTTPS_PORT:-8443}:443
    volumes:
      # origin.pem and origin.key, from Cloudflare (deploy/README.md).
      - ${SIBYLLE_TLS_DIR:-/etc/sibylle/tls}:/etc/nginx/tls:ro
    extra_hosts:
      # webhook listens on the docker0 bridge (systemd/sibylle-webhook.service).
      - host.docker.internal:host-gateway
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging

volumes:
  pgdata:
  uploads:
