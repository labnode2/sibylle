# Production, on dev-external, the labnode VM. Nginx Proxy Manager (NPM), the VM's reverse proxy,
# answers for sibylle.cc and forwards it to http://sibylle:8443 over the VM's shared `proxy`
# network: no port is published here. Only the `sibylle` service (nginx) is on `proxy`; the others
# talk among themselves on `internal`, and the api and the worker also reach the Internet through
# `egress` (Brevo's SMTP, push notifications). The api alone also joins Keycloak on the VM's
# shared `keycloak` network (specs/002-keycloak-auth, research.md K4). The VM's rules apply:
# read-only containers without privileges, limits, data under /mnt/data/sibylle
# (SIBYLLE_DATA_DIR). deploy/update.sh runs it from /opt/sibylle, with the production settings of
# deploy/.env (deploy/README.md). Its own project name keeps a trial on the development PC away
# from the development project (`sibylle`).
name: sibylle-prod

x-logging: &logging
  # Rotated logs: the `local` driver keeps 5 files of 20 MB per container.
  driver: local

# Every container: no capability, no privilege gain, a read-only system; it writes only to its
# data folder and its tmpfs.
x-defaults: &defaults
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging: *logging

x-backend: &backend
  <<: *defaults
  image: ${SIBYLLE_BACKEND_IMAGE:-registry.labnode.ovh/sibylle/backend}:${SIBYLLE_BACKEND_TAG:-main}
  # The image's own user (backend/Dockerfile), owner of the uploads folder.
  user: "10001"
  env_file: .env
  volumes:
    - ${SIBYLLE_DATA_DIR:-/mnt/data/sibylle}/uploads:/data/uploads
  tmpfs:
    # Python's temporary files, and the worker's heartbeat.
    - /tmp:size=64m,mode=1777
  networks: [internal, egress]
  depends_on:
    db:
      condition: service_healthy

# The database is the db service's, not the one in deploy/.env (localhost in development).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sibylle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from deploy/.env}@db:5432/${POSTGRES_DB:-sibylle}
  UPLOAD_DIR: /data/uploads

services:
  db:
    <<: *defaults
    image: postgres:18.6
    container_name: sibylle-db
    # The VM's UID for Sibylle, owner of the database folder; the image's entrypoint gives it a
    # passwd entry of its own (in /tmp).
    user: "2005:2005"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sibylle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing from deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-sibylle}
    volumes:
      - ${SIBYLLE_DATA_DIR:-/mnt/data/sibylle}/db:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:size=1m,mode=1777
      - /tmp:size=16m,mode=1777
    networks: [internal]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    container_name: sibylle-api
    command: ["serve"]
    environment:
      <<: *backend-env
      # Only nginx reaches the API: the visitor's address comes from its X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
      # Keycloak, for the code exchange, its keys and its admin API: on the `keycloak` network,
      # never through NPM, which blocks /admin (OIDC_ISSUER stays the public address).
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    networks: [internal, egress, keycloak]
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    <<: *backend
    container_name: sibylle-worker
    command: ["worker"]
    environment:
      <<: *backend-env
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "sibylle", "worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # The entry point, to which NPM forwards sibylle.cc (deploy/nginx/): the interface, the API and
  # its WebSocket, the deploy hooks. Named after the application, the only name it shows on the
  # `proxy` network.
  sibylle:
    <<: *defaults
    image: ${SIBYLLE_WEB_IMAGE:-registry.labnode.ovh/sibylle/web}:${SIBYLLE_WEB_TAG:-main}
    container_name: sibylle
    # The image's nginx user: it listens above 1024 and writes only to its tmpfs.
    user: "101:101"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN missing from deploy/.env}
    tmpfs:
      # The configuration filled in at start (templates/), nginx's temporary files and its pid.
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101
      - /var/cache/nginx:size=64m,uid=101,gid=101
      - /run:size=1m,uid=101,gid=101
    extra_hosts:
      # webhook listens on the VM's docker0 bridge (systemd/sibylle-webhook.service).
      - host.docker.internal:host-gateway
    networks: [proxy, internal]
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  # NPM's network, created by the VM's setup.sh.
  proxy:
    external: true
  # Keycloak's, `internal: true`, created by the VM's setup.sh (labnode2/docker): it must exist
  # before this file runs.
  keycloak:
    external: true
  internal:
    internal: true
  egress: {}
