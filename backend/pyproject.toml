[project]
name = "sibylle"
version = "0.1.0"
description = "Sibylle : le serveur du jeu de pronostics des rédactions"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "apscheduler>=3.11,<4",
    "pywebpush>=2.0",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "pillow>=11.0",
    "python-multipart>=0.0.17",
]

[project.scripts]
sibylle = "sibylle.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "hypothesis>=6.120",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations keep Alembic's long one-line constraints.
"src/sibylle/db/migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
packages = ["sibylle"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "asyncpg.*", "pywebpush.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: règles pures, sans base ni réseau",
    "integration: services sur un vrai PostgreSQL",
    "contract: routes HTTP, droits et isolation des rédactions",
]
