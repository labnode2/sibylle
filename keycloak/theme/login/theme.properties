# Sibylle's sign-in pages (keycloak/README.md): Keycloak's base theme in the app's Gazette frame
# (template.ftl) and style. The base theme's scripts (authChecker.js, passwordVisibility.js…)
# are found through `parent`.
parent=base
# French only, as the app; the realm must enable internationalization with French as its only
# and default locale, or Keycloak shows its English texts.
locales=fr
styles=css/sibylle.css

# The classes that the base theme's pages put on their parts, for the pages Sibylle leaves as
# they are (one-time codes, passkeys, identity providers…): they take the app's fields and
# buttons. The pages Sibylle rewrites use these classes directly.
kcFormClass=form
kcFormGroupClass=field
kcLabelClass=field-label
kcInputClass=field-input
kcTextareaClass=field-input
kcInputErrorMessageClass=field-error
kcInputHelperTextBeforeClass=field-hint
kcInputHelperTextAfterClass=field-hint
kcInputClassCheckbox=checkbox
kcInputClassRadio=checkbox
kcFormOptionsWrapperClass=links
kcFormButtonsClass=actions
kcButtonClass=button
kcButtonPrimaryClass=
kcButtonDefaultClass=button-secondary
kcButtonSecondaryClass=button button-secondary
kcButtonBlockClass=button-block
kcButtonLargeClass=
kcAlertClass=alert
kcAlertTitleClass=alert-text
