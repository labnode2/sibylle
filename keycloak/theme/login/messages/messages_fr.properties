# Sibylle's words on Keycloak's sign-in pages, as in the app (frontend/src/i18n/fr/auth.json,
# common.json and the server's errors in backend/src/sibylle/i18n/fr.json): « tu », « e-mail »,
# inclusive writing. The base theme's French covers the other keys. Every message goes through
# Java's MessageFormat, so an apostrophe is written twice.

